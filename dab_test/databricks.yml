# This is a Declarative Automation Bundle definition for dab_test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_test
  uuid: 348afa13-f395-4806-9fcf-f5fc52935756

include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  - resources/schemas/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel
  
# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  catalog_name:
    description: "Catalog used by the job"
    default: dev
  performance_target:
    description: "Performance target for the job"
    default: "10"
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-39ee3252-8e93.cloud.databricks.com
    variables:
      catalog: dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-39ee3252-8e93.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rubencruzh@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rubencruzh@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: rubencruzh@gmail.com
        level: CAN_MANAGE
